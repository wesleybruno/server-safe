; Copie para inventory.ini (gitignored) e preencha com os dados reais da VPS.
; ansible_user / ansible_ssh_private_key_file / ansible_port devem bater com
; o que o wizard server-safe criou nas etapas "Users" e "SSH":
;   - ansible_user: username escolhido na etapa Users
;   - ansible_ssh_private_key_file: chave baixada via /download/key/{token} na etapa Users
;   - ansible_port: porta configurada na etapa SSH (se mudou de 22)
[vps]
minha-vps ansible_host=203.0.113.10 ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/deploy_server_safe ansible_port=22
