name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -o server-safe-linux-amd64 ./cmd/server

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -trimpath -o server-safe-linux-arm64 ./cmd/server

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server-safe-linux-amd64
            server-safe-linux-arm64
          generate_release_notes: true
